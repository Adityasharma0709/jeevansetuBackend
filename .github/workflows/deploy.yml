name: Build, Containerize & Deploy

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/jeevansetu-backend:latest

  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Redeploy Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/jeevansetu-backend:latest
            docker stop jeevansetu-backend || true
            docker rm jeevansetu-backend || true
            docker run -d \
              --name jeevansetu-backend \
              --restart unless-stopped \
              -p 3000:3000 \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e NODE_ENV="production" \
              -e ORIGIN="https://www.jeevansetu.org" \
              -e PORT="3000" \
              ${{ secrets.DOCKERHUB_USERNAME }}/jeevansetu-backend:latest
            
            # --- AUTOMATED DISK SPACE MAINTENANCE ---
            # 1. Clean up old unused Docker images, containers, volumes, and build cache
            docker system prune -af --volumes
            
            # 2. Clean package manager caches to reclaim space
            sudo dnf clean all || sudo yum clean all || true
            
            # 3. Vacuum system journal logs to max 50MB
            sudo journalctl --vacuum-size=50M || true
            
            # 4. Clean npm cache
            npm cache clean --force || true
            
            # 5. Remove VS Code Server versions/bins that haven't been used in over 7 days
            if [ -d "$HOME/.vscode-server/bin" ]; then
              find "$HOME/.vscode-server/bin" -mindepth 1 -maxdepth 1 -mtime +7 -exec rm -rf {} + || true
            fi

